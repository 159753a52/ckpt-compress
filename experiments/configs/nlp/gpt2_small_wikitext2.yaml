# GPT-2 Small on WikiText-2 训练配置

model:
  name: gpt2-small
  pretrained: false

dataset:
  name: wikitext2
  data_dir: null  # null 表示从 HuggingFace 下载
  batch_size: 8
  seq_length: 512
  max_samples: null  # null 表示使用全部数据
  num_workers: 0

training:
  epochs: 10
  optimizer: adamw
  lr: 5e-5
  weight_decay: 0.01
  lr_schedule: linear
  warmup_steps: 500
  use_amp: false
  gradient_accumulation_steps: 1

checkpoint:
  save_every: 1
  checkpoint_dir: ./checkpoints/gpt2_small_wikitext2
  early_stopping: 3

device: cuda
