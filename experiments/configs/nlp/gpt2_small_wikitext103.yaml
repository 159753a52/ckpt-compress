# GPT-2 Small on WikiText-103 训练配置

model:
  name: gpt2-small
  pretrained: false

dataset:
  name: wikitext103
  data_dir: null  # null 表示从 HuggingFace 下载
  batch_size: 8
  seq_length: 512
  max_samples: null  # null 表示使用全部数据
  num_workers: 0

training:
  epochs: 10
  optimizer: adamw
  lr: 5e-5
  weight_decay: 0.01
  lr_schedule: linear
  warmup_steps: 1000
  use_amp: true  # 使用混合精度训练以节省内存
  gradient_accumulation_steps: 4  # 梯度累积以模拟更大的批次

checkpoint:
  save_every: 1
  checkpoint_dir: ./checkpoints/gpt2_small_wikitext103
  early_stopping: 3

device: cuda
