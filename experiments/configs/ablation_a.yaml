# Table 4: 消融实验配置
# Ablation A: importance × allocation 组合
# GPT-2 Medium / WikiText-103

common:
  num_steps: 100
  eval_batches: 20
  hvp_batches: 8
  alpha: 0.5

models:
  - name: gpt2-medium
    dataset: wikitext103
    batch_size: 4
    seq_length: 512

# 仅测试 20% 和 40% 稀疏度
sparsity_levels: [0.2, 0.4]

# Ablation A: importance × allocation 的 5 种组合
methods:
  - label: magnitude+uniform
  - label: first-order+uniform
  - label: second-order-hvp+uniform
  - label: first-order+gamma-adaptive
  - label: second-order-hvp+gamma-adaptive
