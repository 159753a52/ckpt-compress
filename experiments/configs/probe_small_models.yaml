schema_version: 1

# Breadth study of coverage-tracked Gauss-Newton probe scores on the small
# causal-LM workloads of paper_experiments.yaml, under the same matched
# residual-recovery protocol (checkpoints, data, pool sizes, training segments,
# learning rate, scoring batches). K=1, prune ratios 0.5 and 0.9, three seeds.
# Every compressed method except dacp uses exact global top-k selection.
methods:
  - no_compression
  - excp_style
  - inshrinkerator_style
  - first_order_exact_global
  - taylor_exact_global
  - dacp
  - probe_topk_m1_exact_global
  - probe_topk_m4_exact_global
  - probe_sample_m1_exact_global
  - probe_sample_m4_exact_global
  - probe_headtail_m2_exact_global

claim_gates:
  matched_scoring_main_table:
    baseline_owners: [excp, inshrinkerator]
    required_baseline_fidelity: style

defaults:
  prune_ratios: [0.5, 0.9]
  max_layer_ratio: 0.95
  recovery_counts: [1]
  total_steps: 100
  hvp_batches: 8
  eval_batches: 100
  checkpoint_step: 1000
  batch_size: 2
  seq_length: 128
  learning_rate: 5.0e-5
  seeds: [42, 43, 44]

workloads:
  - name: gpt2_medium_wikitext103
    model: gpt2-medium
    dataset: wikitext103
    checkpoint: checkpoints/gpt2_medium_wikitext103_1000steps/checkpoint_step_1000.pt
    data_dir: data/wikitext103
    metric: perplexity
    train_pool_batches: 124

  - name: pythia_410m_alpaca
    model: pythia-410m
    dataset: alpaca
    checkpoint: checkpoints/pythia_410m_alpaca/checkpoint_step_1000.pt
    data_dir: data
    metric: perplexity
    train_pool_batches: 108

  - name: pythia_1b_alpaca
    model: pythia-1b
    dataset: alpaca
    checkpoint: checkpoints/pythia_1b_alpaca/checkpoint_step_1000.pt
    data_dir: data
    metric: perplexity
    train_pool_batches: 108
