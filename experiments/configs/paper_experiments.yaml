schema_version: 1

# These are scoring-stage comparisons under one matched residual-recovery protocol.
# They must be described as ExCP-style and Inshrinkerator-style, not full reproductions.
methods: [no_compression, excp_style, inshrinkerator_style, dacp]

claim_gates:
  matched_scoring_main_table:
    baseline_owners: [excp, inshrinkerator]
    required_baseline_fidelity: style
  full_end_to_end_baseline_claim:
    baseline_owners: [excp, inshrinkerator]
    required_baseline_fidelity: full
    enabled: false

defaults:
  prune_ratios: [0.5]
  max_layer_ratio: 0.95
  recovery_counts: [1]
  total_steps: 100
  hvp_batches: 8
  eval_batches: 100
  batch_size: 2
  seq_length: 128
  learning_rate: 5.0e-5

workloads:
  - name: gpt2_medium_wikitext103
    model: gpt2-medium
    dataset: wikitext103
    checkpoint: checkpoints/gpt2_medium_wikitext103_1000steps/checkpoint_step_1000.pt
    data_dir: data/wikitext103
    metric: perplexity
    seeds: [42, 43, 44, 45, 46]
    prune_ratios: [0.3, 0.5, 0.7, 0.9]
    recovery_counts: [1, 3]
    train_pool_batches: 124

  - name: gpt2_large_wikitext103
    model: gpt2-large
    dataset: wikitext103
    checkpoint: checkpoints/gpt2_large_wikitext103/checkpoint_step_1000.pt
    data_dir: data/wikitext103
    metric: perplexity
    seeds: [42, 43, 44]
    train_pool_batches: 108

  - name: bert_large_mnli
    model: bert-large
    dataset: mnli
    checkpoint: checkpoints/bert_large_mnli/checkpoint_step_1000.pt
    data_dir: data
    metric: accuracy
    seeds: [42, 43, 44]
    prune_ratios: [0.3, 0.5]
    train_pool_batches: 108

  - name: pythia_410m_alpaca
    model: pythia-410m
    dataset: alpaca
    checkpoint: checkpoints/pythia_410m_alpaca/checkpoint_step_1000.pt
    data_dir: data
    metric: perplexity
    seeds: [42, 43, 44]
    train_pool_batches: 108

  - name: pythia_1b_alpaca
    model: pythia-1b
    dataset: alpaca
    checkpoint: checkpoints/pythia_1b_alpaca/checkpoint_step_1000.pt
    data_dir: data
    metric: perplexity
    seeds: [42, 43, 44]
    train_pool_batches: 108
