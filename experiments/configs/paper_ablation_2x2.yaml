schema_version: 1

# Single-seed scoring/allocation ablation under the matched residual protocol.
methods: [magnitude_uniform, magnitude_weibull, taylor_uniform, dacp, taylor_exact_global]

claim_gates: {}

defaults:
  prune_ratios: [0.5]
  max_layer_ratio: 0.95
  recovery_counts: [1]
  total_steps: 100
  hvp_batches: 8
  eval_batches: 100
  checkpoint_step: 1000
  batch_size: 2
  seq_length: 128
  learning_rate: 5.0e-5

workloads:
  - name: gpt2_medium_wikitext103
    model: gpt2-medium
    dataset: wikitext103
    checkpoint: checkpoints/gpt2_medium_wikitext103_1000steps/checkpoint_step_1000.pt
    data_dir: data/wikitext103
    metric: perplexity
    seeds: [42]
    train_pool_batches: 124
