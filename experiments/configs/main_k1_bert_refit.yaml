schema_version: 1

# Classification-family evidence on a properly fine-tuned checkpoint:
# BERT-Large / MNLI (refit to 83.0% validation accuracy), 50% residual,
# K=1, three seeds.
methods: [no_compression, excp_style, inshrinkerator_style, dacp, taylor_signed_benefit_weibull]

claim_gates: {}

defaults:
  prune_ratios: [0.5]
  max_layer_ratio: 0.95
  recovery_counts: [1]
  total_steps: 100
  hvp_batches: 8
  eval_batches: 100
  checkpoint_step: 3000
  batch_size: 2
  seq_length: 128
  learning_rate: 5.0e-5

workloads:
  - name: bert_large_mnli_refit
    model: bert-large
    dataset: mnli
    checkpoint: checkpoints/bert_large_mnli_refit/checkpoint_step_3000.pt
    data_dir: data
    metric: accuracy
    seeds: [42, 43, 44]
    train_pool_batches: 108
