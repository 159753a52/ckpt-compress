schema_version: 1

# Which signed Taylor term drives the benefit signal? Same protocol as
# diag_score_variants (seed 42, 50%, K=1). Bars: inshrinkerator_style 23.6937,
# taylor_signed_uniform 23.6301, dacp(abs) 24.0535.
methods: [taylor_signed_fo_uniform, taylor_signed_so_uniform]

claim_gates: {}

defaults:
  prune_ratios: [0.5]
  max_layer_ratio: 0.95
  recovery_counts: [1]
  total_steps: 100
  hvp_batches: 8
  eval_batches: 100
  checkpoint_step: 1000
  batch_size: 2
  seq_length: 128
  learning_rate: 5.0e-5

workloads:
  - name: gpt2_medium_wikitext103
    model: gpt2-medium
    dataset: wikitext103
    checkpoint: checkpoints/gpt2_medium_wikitext103_1000steps/checkpoint_step_1000.pt
    data_dir: data/wikitext103
    metric: perplexity
    seeds: [42]
    train_pool_batches: 124
