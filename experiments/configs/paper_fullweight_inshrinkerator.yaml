schema_version: 1
experiment_scope: full_weight_pruning_only

workloads:
  - name: gpt2_medium_wikitext103
    model: gpt2-medium
    dataset: wikitext103
    checkpoint: checkpoints/gpt2_medium_wikitext103_1000steps/checkpoint_step_1000.pt
    checkpoint_step: 1000
    data_dir: data/wikitext103
    metric: perplexity
    seeds: [42]

direct_weight_prune_ratios: [0.2, 0.3, 0.4]
hvp_batches: 8
eval_batches: 100
batch_size: 2
seq_length: 128
protect_fraction: 0.005
inshrinkerator_search_json: results/paper_runs/inshrinkerator_search/gpt2_medium_wikitext103_seed42.json
