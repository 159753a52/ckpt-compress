schema_version: 1

# Main-result suite for the optimized DACP implementation:
# signed Taylor damage score + two-stage benefit-aware Weibull allocation,
# against both style baselines and the original abs-score DACP, at the
# paper's compound-recovery operating point (GPT-2 Medium, 50%, K=3, 5 seeds).
methods: [no_compression, excp_style, inshrinkerator_style, dacp, taylor_signed_benefit_weibull]

claim_gates:
  matched_scoring_main_table:
    baseline_owners: [excp, inshrinkerator]
    required_baseline_fidelity: style

defaults:
  prune_ratios: [0.7]
  max_layer_ratio: 0.95
  recovery_counts: [3]
  total_steps: 100
  hvp_batches: 8
  eval_batches: 100
  checkpoint_step: 1000
  batch_size: 2
  seq_length: 128
  learning_rate: 5.0e-5

workloads:
  - name: gpt2_medium_wikitext103
    model: gpt2-medium
    dataset: wikitext103
    checkpoint: checkpoints/gpt2_medium_wikitext103_1000steps/checkpoint_step_1000.pt
    data_dir: data/wikitext103
    metric: perplexity
    seeds: [42, 43, 44, 45, 46]
    train_pool_batches: 124
