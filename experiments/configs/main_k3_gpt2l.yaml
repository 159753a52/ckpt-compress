schema_version: 1

# Fourth scale point for G4: GPT-2 Large (774M) at the flagship scenario
# (50% residual, K=3 compound recovery), three seeds.
methods: [no_compression, excp_style, inshrinkerator_style, dacp, taylor_signed_benefit_weibull]

claim_gates: {}

defaults:
  prune_ratios: [0.5]
  max_layer_ratio: 0.95
  recovery_counts: [3]
  total_steps: 100
  hvp_batches: 8
  eval_batches: 100
  checkpoint_step: 1000
  batch_size: 2
  seq_length: 128
  learning_rate: 5.0e-5

workloads:
  - name: gpt2_large_wikitext103
    model: gpt2-large
    dataset: wikitext103
    checkpoint: checkpoints/gpt2_large_wikitext103/checkpoint_step_1000.pt
    data_dir: data/wikitext103
    metric: perplexity
    seeds: [42, 43, 44]
    train_pool_batches: 124
